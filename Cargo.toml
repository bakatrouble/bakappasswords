[package]
name = "basic-auth-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-reverse-proxy = "2.4.0"
axum-vite-spa-bundle = "1.0.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
hex = "0.4.3"
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
rand = "0.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8"
rustls = { version = "0.23", features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = { version = "0.6.0", features = ["password-hash"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
